name: Temporary Hungarian Promo Voiceover

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install neural TTS
        run: pip install edge-tts

      - name: Generate Hungarian male narration
        shell: bash
        run: |
          mkdir -p hu_voiceover
          python - <<'PY'
          import asyncio, edge_tts, json

          scripts = [
              ("01", "Ismerd meg a Jarvist. Egy intelligens asszisztenst, amely nem egyszerűen válaszol, hanem megérti, mit szeretnél elérni. Beszélhetsz hozzá természetesen, kérhetsz segítséget, és a Jarvis a megfelelő eszközökkel segít végigvinni a feladatot."),
              ("02", "Nem kell menükben keresgélned. Csak mondd el, mire van szükséged. A Jarvis követi a beszélgetés menetét, figyelembe veszi az előzményeket, és úgy válaszol, hogy a munka folyamatos és természetes maradjon."),
              ("03", "E-mailek, fájlok, naptár és feladatok. A Jarvis egy helyre hozza a mindennapi teendőket. Segít rendszerezni, összefoglalni, megtervezni és gyorsabban elvégezni azt, amire éppen szükséged van."),
              ("04", "Ha valamit vizuálisan szeretnél elkészíteni, a Jarvis ebben is segít. Képet készíthet az ötletedből, módosíthat meglévő képeket, és segíthet a kreatív munkát az első ötlettől a kész eredményig eljuttatni."),
              ("05", "A műhelyben a Jarvis kéz nélküli diagnosztikai társsá válhat. Rákérdezhetsz egy hibakódra, összehasonlíthatod az élő adatokat, és munka közben is kérhetsz magyarázatot arra, mi változott az autón."),
              ("06", "Útközben navigációs asszisztensként segíthet. Megkérdezheted a leggyorsabb útvonalat, kereshetsz közeli benzinkutat, vagy egyszerűen kérhetsz egy jobb útvonalat hazafelé."),
              ("07", "Egészségügyi adatoknál a Jarvis érthetően összefoglalhatja, mit mutatnak az értékek és a trendek. Nem csak egy számot látsz, hanem egy gyors, világos magyarázatot is arról, mi történik."),
              ("08", "Ha valami sürgős helyzet alakul ki, a Jarvis segíthet összeszedni a fontos információkat, megmutatni a következő lépéseket, és gyorsabban eljutni a szükséges segítséghez."),
              ("09", "Ez a Jarvis lényege. Nem sok különálló eszköz, hanem egyetlen intelligens asszisztens, amely megérti, mire van szükséged, és a megfelelő képességet használja a megfelelő pillanatban.")
          ]

          async def main():
              voices = await edge_tts.list_voices()
              hu = [v for v in voices if v.get("Locale") == "hu-HU"]
              male = [v for v in hu if v.get("Gender") == "Male"]
              if not hu:
                  raise RuntimeError("No Hungarian voice found")
              voice = (male or hu)[0]["ShortName"]
              print("Using voice:", voice)
              for idx, text in scripts:
                  communicate = edge_tts.Communicate(text, voice=voice, rate="-4%", pitch="-2Hz")
                  await communicate.save(f"hu_voiceover/{idx}.mp3")
              with open("hu_voiceover/voice.json", "w", encoding="utf-8") as f:
                  json.dump({"voice": voice}, f, ensure_ascii=False)

          asyncio.run(main())
          PY

      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-hu-voiceover
          path: hu_voiceover/
          if-no-files-found: error
