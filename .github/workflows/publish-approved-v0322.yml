# One-time release promotion for the exact owner-approved, unsigned v0.3.22
# Windows artifact. Unlike the standard workflow's manual release controls,
# this file can run only on the owner-approved merge commit that introduces it.
# It downloads the independently verified MAIN-branch CI artifact and refuses
# any unexpected version, SHA-256, source commit or signing status.
name: Publish approved Jarvis v0.3.22 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-approved-v0322.yml'

permissions:
  contents: read

concurrency:
  group: jarvis-owner-approved-onetime-v0322
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'bigzsorzs-sketch/jarvis-windows-v0.1' &&
      startsWith(github.event.head_commit.message, 'Owner-approved one-time unsigned Jarvis v0.3.22 release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the main branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Confirm pinned successful main build and version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.3.22"
          test -f release-notes/v0.3.22.md
          git merge-base --is-ancestor a31ce00d2e7639271e600282c7f8742aa1935362 HEAD
          actual_run_status="$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/36739720932 --jq '.conclusion')"
          actual_run_sha="$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/36739720932 --jq '.head_sha')"
          test "$actual_run_status" = "success"
          test "$actual_run_sha" = "a31ce00d2e7639271e600282c7f8742aa1935362"
          actual_run_branch="$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/36739720932 --jq '.head_branch')"
          actual_run_event="$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/36739720932 --jq '.event')"
          actual_artifact_id="$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/36739720932/artifacts --jq '.artifacts[] | select(.name == "Jarvis-Windows-x64") | .id')"
          test "$actual_run_branch" = "main"
          test "$actual_run_event" = "push"
          test "$actual_artifact_id" = "11110805780"
          if gh release view v0.3.22 --repo bigzsorzs-sketch/jarvis-windows-v0.1 >/dev/null 2>&1; then
            echo "::error::Release v0.3.22 already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Download immutable x64 installer from successful main build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download 36739720932 \
            --repo bigzsorzs-sketch/jarvis-windows-v0.1 \
            --name Jarvis-Windows-x64 \
            --dir release

      - name: Verify the exact approved installer, manifest and unsigned status
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const version = '0.3.22';
          const source = 'a31ce00d2e7639271e600282c7f8742aa1935362';
          const name = 'Jarvis-Setup-0.3.22-x64.exe';
          const hash = 'e38bfdd322037551622b0cc360af5042fb15b702d6050d20ef8d03ab2b9aea9d';
          const base = 'release/';
          const exe = fs.readFileSync(base + name);
          const actual = crypto.createHash('sha256').update(exe).digest('hex');
          if (actual !== hash) throw new Error('APPROVED_INSTALLER_SHA256_MISMATCH');
          const manifest = JSON.parse(fs.readFileSync(base + 'release-manifest.json', 'utf8').replace(/^\uFEFF/, ''));
          if (manifest.version !== version || manifest.commit !== source || manifest.installer !== name
              || manifest.sha256 !== hash || manifest.ref !== 'refs/heads/main') {
            throw new Error('APPROVED_MAIN_ARTIFACT_MANIFEST_MISMATCH');
          }
          if (manifest.signing?.status !== 'NotSigned') {
            throw new Error('APPROVED_UNSIGNED_STATUS_MISMATCH');
          }
          const checksum = fs.readFileSync(base + name + '.sha256', 'utf8');
          if (!new RegExp('^' + hash + '(?:\\s|$)', 'im').test(checksum)) {
            throw new Error('APPROVED_CHECKSUM_ASSET_MISMATCH');
          }
          console.log('Approved installer SHA-256 verified:', actual);
          console.log('Unsigned publication was explicitly approved by the owner.');
          NODE

      - name: Publish v0.3.22 with the approved unsigned exception
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.3.22 \
            release/Jarvis-Setup-0.3.22-x64.exe \
            release/Jarvis-Setup-0.3.22-x64.exe.sha256 \
            release/release-manifest.json \
            --repo bigzsorzs-sketch/jarvis-windows-v0.1 \
            --target a31ce00d2e7639271e600282c7f8742aa1935362 \
            --title "Jarvis v0.3.22" \
            --notes-file release-notes/v0.3.22.md \
            --latest

      - name: Confirm the official Release exists with all required assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/releases/tags/v0.3.22 \
            --jq '[.tag_name, .draft, .prerelease, ([.assets[].name] | sort | join(","))] | @tsv'
          for item in Jarvis-Setup-0.3.22-x64.exe Jarvis-Setup-0.3.22-x64.exe.sha256 release-manifest.json; do
            gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/releases/tags/v0.3.22 \
              --jq '.assets[].name' | grep -Fx "$item"
          done
