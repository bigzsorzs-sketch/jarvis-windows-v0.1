# One-time, hash-pinned v0.3.29 release based on the owner-approved
# unsigned output of the already successful main-branch Windows build.
name: Publish approved Jarvis v0.3.29 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-approved-v0329.yml'

permissions:
  contents: read

concurrency:
  group: jarvis-one-time-owner-approved-v0329
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'bigzsorzs-sketch/jarvis-windows-v0.1' &&
      startsWith(github.event.head_commit.message, 'Owner-approved unsigned Jarvis v0.3.29 release')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out exact main state
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Confirm one-time publisher is the only change after verified main build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "147ae5f7fecf072684be04e05d9bb6ab1ae2c377"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/publish-approved-v0329.yml"
          test "$(node -p "require('./package.json').version")" = "0.3.29"
          test -f release-notes/v0.3.29.md
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37679315429 --jq '.conclusion')" = "success"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37679315429 --jq '.head_sha')" = "147ae5f7fecf072684be04e05d9bb6ab1ae2c377"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37679315429 --jq '.head_branch')" = "main"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37679315429 --jq '.event')" = "push"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37679315429/jobs --jq '.jobs[] | select(.name == "CodeQL security scan") | .steps[] | select(.name == "Require successful CodeQL security result") | .conclusion')" = "success"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37679315429/artifacts --jq '.artifacts[] | select(.name == "Jarvis-Windows-x64") | .id')" = "11508912664"
          if gh release view v0.3.29 --repo bigzsorzs-sketch/jarvis-windows-v0.1 >/dev/null 2>&1; then
            echo "::error::v0.3.29 already exists. Refusing to overwrite."
            exit 1
          fi

      - name: Retrieve original successfully tested x64 installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download 37679315429 \
            --repo bigzsorzs-sketch/jarvis-windows-v0.1 \
            --name Jarvis-Windows-x64 \
            --dir release

      - name: Verify exact installer and explicit unsigned owner release
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const name='Jarvis-Setup-0.3.29-x64.exe';
          const expected='9a40684cbcfcbc33220e5df5a2ba90eee1f1af00db1c8d259f05d2869747607b';
          const actual=crypto.createHash('sha256').update(fs.readFileSync('release/'+name)).digest('hex');
          if(actual!==expected) throw new Error('OWNER_APPROVED_INSTALLER_HASH_MISMATCH');
          const manifest=JSON.parse(fs.readFileSync('release/release-manifest.json','utf8').replace(/^\uFEFF/,''));
          if(manifest.version!=='0.3.29' || manifest.commit!=='147ae5f7fecf072684be04e05d9bb6ab1ae2c377'
              || manifest.installer!==name || manifest.sha256!==expected
              || manifest.ref!=='refs/heads/main') {
            throw new Error('OWNER_APPROVED_MANIFEST_MISMATCH');
          }
          if(manifest.signing?.status!=='NotSigned') {
            throw new Error('OWNER_APPROVED_UNSIGNED_STATE_MISMATCH');
          }
          const checksumContent=fs.readFileSync('release/'+name+'.sha256','utf8');
          if(!new RegExp('^'+expected+'(?:\\s|$)','im').test(checksumContent)) {
            throw new Error('OWNER_APPROVED_CHECKSUM_FILE_MISMATCH');
          }
          console.log('Checked unsigned Jarvis v0.3.29 source, SHA-256 and manifest.');
          NODE

      - name: Publish the verified unsigned release once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.3.29 \
            release/Jarvis-Setup-0.3.29-x64.exe \
            release/Jarvis-Setup-0.3.29-x64.exe.sha256 \
            release/release-manifest.json \
            --repo bigzsorzs-sketch/jarvis-windows-v0.1 \
            --target 147ae5f7fecf072684be04e05d9bb6ab1ae2c377 \
            --title "Jarvis v0.3.29" \
            --notes-file release-notes/v0.3.29.md \
            --latest

      - name: Verify GitHub release assets and exact release target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          actual_target="$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/releases/tags/v0.3.29 --jq '.target_commitish')"
          test "$actual_target" = "147ae5f7fecf072684be04e05d9bb6ab1ae2c377"
          for item in Jarvis-Setup-0.3.29-x64.exe Jarvis-Setup-0.3.29-x64.exe.sha256 release-manifest.json; do
            gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/releases/tags/v0.3.29 --jq '.assets[].name' | grep -Fx "$item"
          done
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/releases/tags/v0.3.29 --jq '.draft')" = "false"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/releases/tags/v0.3.29 --jq '.prerelease')" = "false"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/git/ref/tags/v0.3.29 --jq '.object.sha')" = "147ae5f7fecf072684be04e05d9bb6ab1ae2c377"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/releases/tags/v0.3.29 --jq '.assets[] | select(.name == "Jarvis-Setup-0.3.29-x64.exe") | .digest')" = "sha256:9a40684cbcfcbc33220e5df5a2ba90eee1f1af00db1c8d259f05d2869747607b"
          gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/releases/tags/v0.3.29 > published-release.json
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const release=JSON.parse(fs.readFileSync('published-release.json','utf8'));
          for(const name of ['Jarvis-Setup-0.3.29-x64.exe','Jarvis-Setup-0.3.29-x64.exe.sha256','release-manifest.json']) {
            const asset=release.assets.filter(a=>a.name===name);
            if(asset.length!==1 || asset[0].state!=='uploaded') throw new Error('PUBLISHED_ASSET_STATE_MISMATCH:'+name);
            const bytes=fs.readFileSync('release/'+name);
            const digest='sha256:'+crypto.createHash('sha256').update(bytes).digest('hex');
            if(asset[0].digest!==digest || asset[0].size!==bytes.length) throw new Error('PUBLISHED_ASSET_DIGEST_MISMATCH:'+name);
          }
          console.log('Verified published installer, checksum and manifest asset digests.');
          NODE
