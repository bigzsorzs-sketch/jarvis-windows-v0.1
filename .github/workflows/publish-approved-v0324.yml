# One-time, hash-pinned v0.3.24 release based on the owner-approved
# unsigned output of the already successful main-branch Windows build.
name: Publish approved Jarvis v0.3.24 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-approved-v0324.yml'

permissions:
  contents: read

concurrency:
  group: jarvis-one-time-owner-approved-v0324
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'bigzsorzs-sketch/jarvis-windows-v0.1' &&
      startsWith(github.event.head_commit.message, 'Owner-approved unsigned Jarvis v0.3.24 release')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out exact main state
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Confirm one-time publisher is the only change after verified main build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2007005f9e7fab6f7f0a48018fb541ed94c9215b"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/publish-approved-v0324.yml"
          test "$(node -p "require('./package.json').version")" = "0.3.24"
          test -f release-notes/v0.3.24.md
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37429708124 --jq '.conclusion')" = "success"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37429708124 --jq '.head_sha')" = "2007005f9e7fab6f7f0a48018fb541ed94c9215b"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37429708124 --jq '.head_branch')" = "main"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37429708124 --jq '.event')" = "push"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37429708124/artifacts --jq '.artifacts[] | select(.name == "Jarvis-Windows-x64") | .id')" = "11396479653"
          if gh release view v0.3.24 --repo bigzsorzs-sketch/jarvis-windows-v0.1 >/dev/null 2>&1; then
            echo "::error::v0.3.24 already exists. Refusing to overwrite."
            exit 1
          fi

      - name: Retrieve original successfully tested x64 installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download 37429708124 \
            --repo bigzsorzs-sketch/jarvis-windows-v0.1 \
            --name Jarvis-Windows-x64 \
            --dir release

      - name: Verify exact installer and explicit unsigned owner release
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const name='Jarvis-Setup-0.3.24-x64.exe';
          const expected='81714de8fca5276a9dd0f4e26e2e591f5747380016c146e8269690dfa51a10ab';
          const actual=crypto.createHash('sha256').update(fs.readFileSync('release/'+name)).digest('hex');
          if(actual!==expected) throw new Error('OWNER_APPROVED_INSTALLER_HASH_MISMATCH');
          const manifest=JSON.parse(fs.readFileSync('release/release-manifest.json','utf8').replace(/^\uFEFF/,''));
          if(manifest.version!=='0.3.24' || manifest.commit!=='2007005f9e7fab6f7f0a48018fb541ed94c9215b'
              || manifest.installer!==name || manifest.sha256!==expected
              || manifest.ref!=='refs/heads/main') {
            throw new Error('OWNER_APPROVED_MANIFEST_MISMATCH');
          }
          if(manifest.signing?.status!=='NotSigned') {
            throw new Error('OWNER_APPROVED_UNSIGNED_STATE_MISMATCH');
          }
          const checksumContent=fs.readFileSync('release/'+name+'.sha256','utf8');
          if(!new RegExp('^'+expected+'(?:\\s|$)','im').test(checksumContent)) {
            throw new Error('OWNER_APPROVED_CHECKSUM_FILE_MISMATCH');
          }
          console.log('Checked unsigned Jarvis v0.3.24 source, SHA-256 and manifest.');
          NODE

      - name: Publish the verified unsigned release once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.3.24 \
            release/Jarvis-Setup-0.3.24-x64.exe \
            release/Jarvis-Setup-0.3.24-x64.exe.sha256 \
            release/release-manifest.json \
            --repo bigzsorzs-sketch/jarvis-windows-v0.1 \
            --target 2007005f9e7fab6f7f0a48018fb541ed94c9215b \
            --title "Jarvis v0.3.24" \
            --notes-file release-notes/v0.3.24.md \
            --latest

      - name: Verify GitHub release assets and exact release target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          actual_target="$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/releases/tags/v0.3.24 --jq '.target_commitish')"
          test "$actual_target" = "2007005f9e7fab6f7f0a48018fb541ed94c9215b"
          for item in Jarvis-Setup-0.3.24-x64.exe Jarvis-Setup-0.3.24-x64.exe.sha256 release-manifest.json; do
            gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/releases/tags/v0.3.24 --jq '.assets[].name' | grep -Fx "$item"
          done
