name: Publish Jarvis v0.3.6 owner-approved unsigned release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.3.6.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download tested v0.3.6 artifact
        uses: actions/download-artifact@v4
        with:
          name: Jarvis-Windows-x64
          path: release
          run-id: 36397090753
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify expected files and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test -f release/Jarvis-Setup-0.3.6-x64.exe
          test -f release/Jarvis-Setup-0.3.6-x64.exe.sha256
          test -f release/release-manifest.json
          cd release
          sha256sum -c Jarvis-Setup-0.3.6-x64.exe.sha256

      - name: Verify manifest version and source commit
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('release/release-manifest.json','utf8'));
          if (m.version !== '0.3.6') throw new Error('Manifest version mismatch: ' + m.version);
          if (m.commit !== '733ee3294d1b94dd1ffc1d2ec7018cfbe4c15fa6') throw new Error('Manifest commit mismatch: ' + m.commit);
          console.log('Manifest verified:', m.version, m.commit, m.signing?.status);
          NODE

      - name: Publish immutable v0.3.6 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.3.6 --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release v0.3.6 already exists; refusing to overwrite."
            exit 1
          fi
          gh release create v0.3.6             release/Jarvis-Setup-0.3.6-x64.exe             release/Jarvis-Setup-0.3.6-x64.exe.sha256             release/release-manifest.json             --repo ${{ github.repository }}             --target 733ee3294d1b94dd1ffc1d2ec7018cfbe4c15fa6             --title "Jarvis v0.3.6"             --notes "Stable Windows x64 Jarvis desktop release. Owner-approved unsigned publication after successful CI, smoke test, and SHA-256 verification."
