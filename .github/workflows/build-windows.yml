name: Build Jarvis Windows Installer

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Owner approval: publish the tested installer as the package version release'
        required: true
        default: false
        type: boolean
      allow_unsigned_release:
        description: 'Owner override: allow publishing when Authenticode is not valid'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
      - 'fix/**'
    tags:
      - 'v*'

concurrency:
  group: jarvis-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze source with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  windows-installer:
    needs: codeql
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "npm ci attempt $attempt of $maxAttempts"
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $maxAttempts) {
              Write-Warning "npm ci failed; clearing npm cache and retrying after transient registry failure."
              npm cache clean --force
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          throw "npm ci failed after $maxAttempts attempts"

      - name: Verify dependency lock is clean
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) { throw "package-lock.json is required" }
          if (git status --porcelain -- package.json package-lock.json) {
            throw "Dependency manifest or lockfile changed during npm ci"
          }

      - name: Verify JavaScript syntax
        run: |
          node --check electron/main.cjs
          node --check electron/developer-repair.cjs
          node --check electron/preload.cjs
          node --check electron/security/policy-engine.cjs
          node --check electron/data/local-database.cjs
          node --check electron/data/backup-manager.cjs
          node --check electron/obd/native-obd-bridge.cjs
          node --check electron/analysis/file-analyzer.cjs

      - name: Run source tests
        run: node --test src/tests/*.test.js

      - name: Lint source
        run: npm run lint

      - name: Typecheck TypeScript source
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify Jarvis security and dependencies
        run: npm run verify:jarvis

      - name: Build renderer
        run: npm run build

      - name: Stage installed Self-Repair toolchain
        run: node scripts/stage-self-repair-toolchain.cjs

      - name: Build Windows installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify packaged Self-Repair toolchain
        run: node scripts/test-packaged-toolchain.cjs release\win-unpacked\resources

      - name: Test packaged admin-helper handshake
        run: node scripts/test-packaged-admin-helper.cjs release\win-unpacked\Jarvis.exe

      - name: Smoke test packaged Windows startup
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "release\win-unpacked\Jarvis.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Packaged Jarvis.exe not found: $exe"
          }
          $logFile = Join-Path $env:RUNNER_TEMP "jarvis-electron-smoke.log"
          $env:ELECTRON_ENABLE_LOGGING = "1"
          $arguments = @(
            "--disable-gpu",
            "--disable-gpu-sandbox",
            "--enable-logging=file",
            "--log-file=$logFile"
          )
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            if (Test-Path -LiteralPath $logFile) {
              Write-Host "---- Electron smoke log ----"
              Get-Content -LiteralPath $logFile -Tail 200
            }
            throw "Packaged Jarvis exited during startup smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem release\Jarvis-Setup-*-x64.exe | Select-Object -First 1
          if (-not $exe) { throw "Jarvis installer not found" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content -Path "$($exe.FullName).sha256" -NoNewline

      - name: Create release candidate manifest
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $exe = Get-ChildItem release\Jarvis-Setup-*-x64.exe | Select-Object -First 1
          if (-not $exe) { throw "Jarvis installer not found" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $signature = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          $manifest = [ordered]@{
            version = $pkg.version
            commit = "$env:GITHUB_SHA"
            ref = "$env:GITHUB_REF"
            built_at = (Get-Date).ToUniversalTime().ToString("o")
            installer = $exe.Name
            sha256 = $hash
            signing = [ordered]@{
              status = [string]$signature.Status
              subject = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { $null }
              thumbprint = if ($signature.SignerCertificate) { $signature.SignerCertificate.Thumbprint } else { $null }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path "release\release-manifest.json" -Encoding utf8

      - name: Block release publication outside main
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref != 'refs/heads/main'
        shell: pwsh
        run: throw "Release publication is allowed only from main."

      - name: Verify signer before publication
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Publish v0.3.14 combined approved'))
        shell: pwsh
        run: |
          $exe = Get-ChildItem release\Jarvis-Setup-*-x64.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          $oneTimeOwnerApproval = "$env:GITHUB_EVENT_NAME" -eq "push" -and "${{ github.event.head_commit.message }}".StartsWith("Publish v0.3.14 combined approved")
          $allowUnsigned = ("${{ inputs.allow_unsigned_release }}" -eq "true") -or $oneTimeOwnerApproval
          if ([string]$signature.Status -ne "Valid" -and -not $allowUnsigned) {
            throw "Installer Authenticode status is $($signature.Status). Configure WINDOWS_CSC_LINK / WINDOWS_CSC_KEY_PASSWORD or explicitly approve allow_unsigned_release."
          }
          if ([string]$signature.Status -ne "Valid" -and $allowUnsigned) {
            Write-Warning "Owner explicitly approved an unsigned release."
          }

      - name: Upload Jarvis installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows-x64
          path: |
            release/Jarvis-Setup-*-x64.exe
            release/Jarvis-Setup-*-x64.exe.sha256
            release/release-manifest.json
          if-no-files-found: error

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $expected = "v$($pkg.version)"
          $actual = "${{ github.ref_name }}"
          if ($actual -ne $expected) {
            throw "Release tag $actual does not match package.json version $expected"
          }

      - name: Verify release commit matches package version
        if: startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $expected = "Release v$($pkg.version)"
          $actual = "${{ github.event.head_commit.message }}"
          if (-not $actual.StartsWith($expected)) {
            throw "Release commit must start with $expected"
          }

      - name: Publish immutable GitHub release
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Publish v0.3.14 combined approved'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ("$env:GITHUB_EVENT_NAME" -eq "push" -and [string]$pkg.version -ne "0.3.14") {
            throw "One-time owner-approved push publication is restricted to v0.3.14."
          }
          $tag = "v$($pkg.version)"
          $exe = Get-ChildItem release\Jarvis-Setup-*-x64.exe | Select-Object -First 1
          $sha = Get-Item "$($exe.FullName).sha256"
          $manifest = Get-Item "release\release-manifest.json"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists and will not be overwritten" }
          $global:LASTEXITCODE = 0
          gh release create $tag $exe.FullName $sha.FullName $manifest.FullName --target "$env:GITHUB_SHA" --title "Jarvis $tag" --notes "Jarvis v0.3.14 fixes packaged Self-Repair validation by bundling the complete project package.json as editable source outside app.asar, rejecting incomplete workspace metadata before sandbox tests, and keeping the versioned local AppData workspace introduced in v0.3.13. Includes CodeQL, regression tests, packaged Self-Repair verification, SHA-256 checksum, and release manifest."
