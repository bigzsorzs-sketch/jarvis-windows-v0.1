name: Build Jarvis Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'
      - 'upgrade/**'
    tags:
      - 'v*'

concurrency:
  group: jarvis-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: npm ci

      - name: Verify dependency lock is clean
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) { throw "package-lock.json is required" }
          if (git status --porcelain -- package.json package-lock.json) {
            throw "Dependency manifest or lockfile changed during npm ci"
          }

      - name: Verify JavaScript syntax
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/security/policy-engine.cjs
          node --check electron/data/local-database.cjs
          node --check electron/data/backup-manager.cjs
          node --check electron/obd/native-obd-bridge.cjs
          node --check electron/analysis/file-analyzer.cjs

      - name: Run source tests
        run: node --test src/tests/*.test.js

      - name: Lint source
        run: npm run lint

      - name: Typecheck TypeScript source
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify Jarvis security and dependencies
        run: npm run verify:jarvis

      - name: Build renderer
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify Windows update trust chain
        shell: pwsh
        run: |
          $app = Join-Path $PWD "release\win-unpacked\Jarvis.exe"
          $installer = Get-ChildItem release\Jarvis-Setup-*-x64.exe | Select-Object -First 1
          if (-not (Test-Path -LiteralPath $app)) { throw "Packaged Jarvis.exe not found" }
          if (-not $installer) { throw "Jarvis installer not found" }
          $appSig = Get-AuthenticodeSignature -LiteralPath $app
          $installerSig = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          Write-Host "App signature: $($appSig.Status)"
          Write-Host "Installer signature: $($installerSig.Status)"
          if ($appSig.Status -ne 'Valid' -or $installerSig.Status -ne 'Valid') {
            throw "One-click updater requires valid Authenticode signatures"
          }
          if (-not $appSig.SignerCertificate -or -not $installerSig.SignerCertificate) {
            throw "Signer certificate missing"
          }
          if ($appSig.SignerCertificate.Thumbprint -ne $installerSig.SignerCertificate.Thumbprint) {
            throw "Packaged app and installer signer do not match"
          }

      - name: Smoke test packaged Windows startup
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "release\win-unpacked\Jarvis.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Packaged Jarvis.exe not found: $exe"
          }
          $logFile = Join-Path $env:RUNNER_TEMP "jarvis-electron-smoke.log"
          $env:ELECTRON_ENABLE_LOGGING = "1"
          $arguments = @(
            "--disable-gpu",
            "--disable-gpu-sandbox",
            "--enable-logging=file",
            "--log-file=$logFile"
          )
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            if (Test-Path -LiteralPath $logFile) {
              Write-Host "---- Electron smoke log ----"
              Get-Content -LiteralPath $logFile -Tail 200
            }
            throw "Packaged Jarvis exited during startup smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem release\Jarvis-Setup-*-x64.exe | Select-Object -First 1
          if (-not $exe) { throw "Jarvis installer not found" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content -Path "$($exe.FullName).sha256" -NoNewline

      - name: Upload Jarvis installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows-x64
          path: |
            release/Jarvis-Setup-*-x64.exe
            release/Jarvis-Setup-*-x64.exe.sha256
          if-no-files-found: error

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $expected = "v$($pkg.version)"
          $actual = "${{ github.ref_name }}"
          if ($actual -ne $expected) {
            throw "Release tag $actual does not match package.json version $expected"
          }

      - name: Verify release commit matches package version
        if: startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $expected = "Release v$($pkg.version)"
          $actual = "${{ github.event.head_commit.message }}"
          if (-not $actual.StartsWith($expected)) {
            throw "Release commit must start with $expected"
          }

      - name: Publish immutable GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = "v$($pkg.version)"
          $exe = Get-ChildItem release\Jarvis-Setup-*-x64.exe | Select-Object -First 1
          $sha = Get-Item "$($exe.FullName).sha256"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists and will not be overwritten" }
          $global:LASTEXITCODE = 0
          gh release create $tag $exe.FullName $sha.FullName --target "$env:GITHUB_SHA" --title "Jarvis $tag" --notes "Stable Windows x64 Jarvis desktop release. Includes native multi-transport OBD Core and SHA-256 checksum."
