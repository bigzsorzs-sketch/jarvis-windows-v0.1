name: Build Jarvis Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Verify Jarvis security and dependencies
        run: npm run verify:jarvis
      - name: Build renderer
        run: npm run build
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64
      - name: Upload Jarvis installer
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows-x64
          path: release/*.exe
          if-no-files-found: error
