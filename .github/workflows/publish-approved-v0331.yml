# One-time, hash-pinned v0.3.31 release based on the owner-approved
# unsigned output of the successful exact-source Windows build #937.
name: Publish approved Jarvis v0.3.31 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-approved-v0331.yml'

permissions:
  contents: read

concurrency:
  group: jarvis-one-time-owner-approved-v0331
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'bigzsorzs-sketch/jarvis-windows-v0.1' &&
      startsWith(github.event.head_commit.message, 'Owner-approved unsigned Jarvis v0.3.31 release')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out exact main state
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Confirm one-time publisher is the only change after the verified source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "89b4fcd0e89b604cc714df6836129dcc6ccaf7ea"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/publish-approved-v0331.yml"
          test "$(node -p "require('./package.json').version")" = "0.3.31"
          test -f release-notes/v0.3.31.md
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37899726601 --jq '.conclusion')" = "success"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37899726601 --jq '.head_sha')" = "89b4fcd0e89b604cc714df6836129dcc6ccaf7ea"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37899726601 --jq '.head_branch')" = "fix/windows-product-readiness-20261008"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37899726601 --jq '.event')" = "push"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37899726601/jobs --jq '.jobs[] | select(.name == "CodeQL security scan") | .steps[] | select(.name == "Require successful CodeQL security result") | .conclusion')" = "success"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37899726601/artifacts --jq '.artifacts[] | select(.name == "Jarvis-Windows-x64") | .id')" = "11602605724"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37899726601/artifacts --jq '.artifacts[] | select(.name == "Jarvis-Windows-Acceptance") | .id')" = "11602735176"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37899726601/jobs --jq '.jobs[] | select(.name == "windows-installer") | .steps[] | select(.name == "Test installed Windows workflows and persistence") | .conclusion')" = "success"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37899726601 --jq '.status')" = "completed"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37899726601/jobs --jq '.jobs[] | select(.name == "windows-installer") | .conclusion')" = "success"
          if gh release view v0.3.31 --repo bigzsorzs-sketch/jarvis-windows-v0.1 >/dev/null 2>&1; then
            echo "::error::v0.3.31 already exists. Refusing to overwrite."
            exit 1
          fi

      - name: Retrieve original successfully tested x64 installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download 37899726601 \
            --repo bigzsorzs-sketch/jarvis-windows-v0.1 \
            --name Jarvis-Windows-x64 \
            --dir release
          gh run download 37899726601 \
            --repo bigzsorzs-sketch/jarvis-windows-v0.1 \
            --name Jarvis-Windows-Acceptance \
            --dir release/acceptance

      - name: Verify exact installer and explicit unsigned owner release
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const name='Jarvis-Setup-0.3.31-x64.exe';
          const expected='3de4f5bc07c7c474def23c4cfdfc0ab8ddb17a1ba0215994402cf32e8738c7d1';
          const actual=crypto.createHash('sha256').update(fs.readFileSync('release/'+name)).digest('hex');
          if(actual!==expected) throw new Error('OWNER_APPROVED_INSTALLER_HASH_MISMATCH');
          const manifest=JSON.parse(fs.readFileSync('release/release-manifest.json','utf8').replace(/^\uFEFF/,''));
          if(manifest.version!=='0.3.31' || manifest.commit!=='89b4fcd0e89b604cc714df6836129dcc6ccaf7ea'
              || manifest.installer!==name || manifest.sha256!==expected
              || manifest.ref!=='refs/heads/fix/windows-product-readiness-20261008') {
            throw new Error('OWNER_APPROVED_MANIFEST_MISMATCH');
          }
          if(manifest.signing?.status!=='NotSigned') {
            throw new Error('OWNER_APPROVED_UNSIGNED_STATE_MISMATCH');
          }
          const checksumContent=fs.readFileSync('release/'+name+'.sha256','utf8');
          if(!new RegExp('^'+expected+'(?:\\s|$)','im').test(checksumContent)) {
            throw new Error('OWNER_APPROVED_CHECKSUM_FILE_MISMATCH');
          }
          const acceptance=JSON.parse(fs.readFileSync('release/acceptance/windows-acceptance.json','utf8'));
          if(acceptance.version!=='0.3.31' || acceptance.success!==true || acceptance.provider_calls!==false
              || acceptance.hardware_calls!==false || acceptance.steps?.length!==12
              || acceptance.steps.some(step=>step.success!==true)) throw new Error('INSTALLED_ACCEPTANCE_NOT_VERIFIED');
          console.log('Checked unsigned Jarvis v0.3.31 source, SHA-256 and manifest.');
          NODE

      - name: Publish the verified unsigned release once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const notes=fs.readFileSync('release-notes/v0.3.31.md','utf8')
            .replace('Candidate update based on v0.3.30. Publication requires the exact candidate\'s Windows checks; live provider and device acceptance is still a separate requirement.',
              'Owner-approved Windows release based on v0.3.30. The exact-source Windows checks passed; live provider and device acceptance remains separate.')
            .replace('The exact candidate must pass the Windows native install/build/packaged checks and the new real NSIS install/workflow/restart/uninstall test before an installer is handed over.',
              'The exact candidate passed the Windows native install/build/packaged checks and all 12 real NSIS install/workflow/restart/uninstall/profile-cleanup acceptance steps.')
            .replace('See [the acceptance guide](../docs/windows-product-acceptance.md)',
              'See [the acceptance guide](https://github.com/bigzsorzs-sketch/jarvis-windows-v0.1/blob/89b4fcd0e89b604cc714df6836129dcc6ccaf7ea/docs/windows-product-acceptance.md)');
          fs.writeFileSync('release/published-notes.md',notes+'\nWindows verification: all 438 tests passed, with no skips; 464 source files parsed. CodeQL reported no new findings, production audit had 0 findings, and lint, limited TypeScript checks, immutable core rules, packaging and installed-app acceptance passed.\n\nTested source: `89b4fcd0e89b604cc714df6836129dcc6ccaf7ea`. [Successful build #937](https://github.com/bigzsorzs-sketch/jarvis-windows-v0.1/actions/runs/37899726601). Installer SHA-256: `3de4f5bc07c7c474def23c4cfdfc0ab8ddb17a1ba0215994402cf32e8738c7d1`. The installed acceptance report and screenshot are attached.\n\nThis installer is not Authenticode-signed. Published with the owner\'s release approval; source, installer checksum and manifest are verified. Live Gmail consent/send, real AI/audio, installed backup/repair/update, owner Windows-session and physical-device acceptance remain separate. Mobile packaging, direct CGM and cloud sync are not completed by this release.\n');
          NODE
          gh release create v0.3.31 \
            release/Jarvis-Setup-0.3.31-x64.exe \
            release/Jarvis-Setup-0.3.31-x64.exe.sha256 \
            release/release-manifest.json \
            release/acceptance/windows-acceptance.json \
            release/acceptance/windows-acceptance.png \
            --repo bigzsorzs-sketch/jarvis-windows-v0.1 \
            --target 89b4fcd0e89b604cc714df6836129dcc6ccaf7ea \
            --title "Jarvis v0.3.31" \
            --notes-file release/published-notes.md \
            --latest

      - name: Verify GitHub release assets and exact release target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          actual_target="$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/releases/tags/v0.3.31 --jq '.target_commitish')"
          test "$actual_target" = "89b4fcd0e89b604cc714df6836129dcc6ccaf7ea"
          for item in Jarvis-Setup-0.3.31-x64.exe Jarvis-Setup-0.3.31-x64.exe.sha256 release-manifest.json windows-acceptance.json windows-acceptance.png; do
            gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/releases/tags/v0.3.31 --jq '.assets[].name' | grep -Fx "$item"
          done
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/releases/tags/v0.3.31 --jq '.draft')" = "false"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/releases/tags/v0.3.31 --jq '.prerelease')" = "false"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/git/ref/tags/v0.3.31 --jq '.object.sha')" = "89b4fcd0e89b604cc714df6836129dcc6ccaf7ea"
          test "$(gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/releases/tags/v0.3.31 --jq '.assets[] | select(.name == "Jarvis-Setup-0.3.31-x64.exe") | .digest')" = "sha256:3de4f5bc07c7c474def23c4cfdfc0ab8ddb17a1ba0215994402cf32e8738c7d1"
          gh api repos/bigzsorzs-sketch/jarvis-windows-v0.1/releases/tags/v0.3.31 > published-release.json
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const release=JSON.parse(fs.readFileSync('published-release.json','utf8'));
          for(const name of ['Jarvis-Setup-0.3.31-x64.exe','Jarvis-Setup-0.3.31-x64.exe.sha256','release-manifest.json','windows-acceptance.json','windows-acceptance.png']) {
            const asset=release.assets.filter(a=>a.name===name);
            if(asset.length!==1 || asset[0].state!=='uploaded') throw new Error('PUBLISHED_ASSET_STATE_MISMATCH:'+name);
            const bytes=fs.readFileSync(name.startsWith('windows-acceptance.') ? 'release/acceptance/'+name : 'release/'+name);
            const digest='sha256:'+crypto.createHash('sha256').update(bytes).digest('hex');
            if(asset[0].digest!==digest || asset[0].size!==bytes.length) throw new Error('PUBLISHED_ASSET_DIGEST_MISMATCH:'+name);
          }
          console.log('Verified published installer, checksum and manifest asset digests.');
          NODE
