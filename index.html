<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        const originalWarn = console.warn;
        console.warn = function (...args) {
          const message = args.map(String).join(' ');
          if (message.includes('Datadog Browser SDK:') && message.includes('No storage available for session')) return;
          originalWarn.apply(console, args);
        };
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a2030" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jarvis Assistant" />
    <meta name="application-name" content="Jarvis Assistant" />
    <meta name="description" content="Jarvis Assistant – voice-powered life, work, health, finance, smart home and automotive assistant." />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest?v=2026.04.24.1" />
    <title>Jarvis Assistant</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111827;color:#f9fafb;font-family:Open Sans,sans-serif;padding:24px;text-align:center;">
        <div>
          <div style="width:40px;height:40px;border:4px solid rgba(139,92,246,0.2);border-top-color:#8b5cf6;border-radius:9999px;animation:spin 1s linear infinite;margin:0 auto 16px;"></div>
          <div style="font-size:18px;font-weight:600;">Loading your AI assistant...</div>
          <div id="boot-status" style="font-size:13px;color:#9ca3af;margin-top:8px;">Preparing latest version...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const bootStatus = document.getElementById('boot-status');
      window.addEventListener('offline', () => {
        if (bootStatus) bootStatus.textContent = 'No internet connection. Please try again.';
      });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js?v=2026.04.24.1', { updateViaCache: 'none' })
          .then(async (reg) => {
            await reg.update();
          })
          .catch(() => {});
      }
    </script>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </body>
</html>
